; =====================================================================
;  SDLC AI Toolkit - team configuration
;  Edit this file ONCE for your team, commit it, and every developer
;  gets the same behaviour when they run the installer.
;  Personal overrides: copy to ~/.copilot/sdlc-toolkit/toolkit.local.ini
;  (only the keys you want to change). Never put tokens in this file.
; =====================================================================

[team]
name = My Engineering Team

[jira]
; Your Jira Cloud site
site = https://your-company.atlassian.net
; Comma-separated project keys the agents should accept
project_keys = PROJ
; Regex that identifies a ticket key anywhere (commits, branches, MRs)
ticket_regex = [A-Z][A-Z0-9]+-[0-9]+
; How often agents post progress ("karmic") comments to the ticket:
;   every_stage = after understanding, plan, implementation, quality gate, MR
;   milestones  = only after plan approval and after MRs are opened
;   off         = never post progress comments (final summary only)
progress_updates = every_stage
; Workflow transition names (leave blank to skip that transition)
transition_on_start = In Progress
transition_on_mr = In Review
; Label added to tickets worked on with the toolkit (blank = none)
label = ai-assisted

[gitlab]
url = https://gitlab.com
; Default group/namespace that holds your repos (used to build links)
group = your-group
default_target_branch = main
mr_labels = ai-assisted
mr_draft = true
squash_on_merge = false
remove_source_branch = true
; Reviewers are suggested from CODEOWNERS when present; extra defaults:
default_reviewers =

[mcp]
; Official Atlassian Rovo MCP server (OAuth 2.1 in the browser)
atlassian_url = https://mcp.atlassian.com/v1/mcp/authv2
; Official GitLab MCP server (OAuth in the browser). For self-managed
; GitLab replace the host.
gitlab_url = https://gitlab.com/api/v4/mcp
; Also write servers to the VS Code profile mcp.json (in addition to the
; portable ~/.copilot/mcp-config.json). yes/no
write_vscode_profile_mcp = yes

[journal]
; Personal work journal: every ticket activity (impact analysis, development,
; bugfix, ...) is logged here so weekly/monthly/yearly reports can be generated.
; One file per user, shared by ALL VS Code workspaces. Survives upgrade/uninstall.
enabled = yes
; Default: ~/.copilot/sdlc-journal/worklog.jsonl (set a path to sync via OneDrive/Dropbox)
path =

[orbit]
; GitLab Orbit CLI: code knowledge graph used by impact analysis
; (definitions, callers, imports, tests across all repos of a workspace folder).
enabled = yes
; Installer installs the CLI if missing: npm (npm i -g @gitlab/orbit) or script
install_method = npm
; Index the workspace folder's repos when the installer / `sdlc orbit index` runs
auto_index = yes
; Each workspace folder keeps its OWN graph in <folder>/<work_dir>/orbit
; (via ORBIT_DATA_DIR), so products / versions never mix.
; `gitlab-orbit` MCP server registered in every editor:
;   local  (default) scripts/orbit_mcp.py on this machine: serves the graph of
;          the open folder over stdio, indexes it on first use, never calls
;          GitLab, no sign-in. Needs the Orbit CLI above.
;   remote hosted endpoint mcp_url (GitLab data: MRs, issues, pipelines);
;          needs Orbit turned on for your GitLab group and an OAuth sign-in.
;   off    no gitlab-orbit server (the CLI is still used by the agents)
mcp_mode = local
mcp_url = https://gitlab.com/api/v4/orbit/mcp
; CLI usage telemetry to GitLab (never repo content): yes/no
telemetry = no

[git]
; Branch name pattern. Placeholders: {type} {key} {slug}
; current = work on the branch each repo is already on (default);
; new = create a ticket branch from branch_pattern
branch_mode = current
; Team convention: feature/<username>/<KEY>, bugfix/<username>/<KEY>,
; spike/<poc_name>/<KEY>, refactor/<username>/<KEY>, chore/<username>/<KEY>
; e.g. feature/kumar/JIVA70-1919, spike/py3/JIVA66-9988
branch_pattern = {type}/{user}/{key}
branch_types = feature, bugfix, spike, refactor, chore
; Commit subject must match this regex (enforced by the commit-msg hook)
commit_regex = ^(feat|fix|refactor|perf|test|docs|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [A-Z][A-Z0-9]+-[0-9]+ .{5,}$
max_subject_length = 72
; Allowed commit types (shown to the agent and in hook error messages)
commit_types = feat, fix, refactor, perf, test, docs, build, ci, chore, revert
; Require a body explaining WHY for feat/fix commits. yes/no
require_body_for = feat, fix
; Never commit directly to these branches
protected_branches = main, master, develop, release/*

[quality]
; Commands run by the quality gate. {files} = changed .py files,
; {paths} = changed top-level packages. Leave blank to auto-detect.
; Missing tools are reported, not fatal, unless listed in "required".
lint = ruff check {files}
format_check = ruff format --check {files}
typecheck =
security = bandit -q -ll {files}
; Test command. Blank = auto-detect (bin/test, zope-testrunner, pytest)
tests =
coverage_min = 0
; Tools that MUST pass for the gate to be green
required = lint, tests
; Zope flavour, used by the impact-analysis & standards skills:
;   zope2 | zope4 | zope5 | plone5 | plone6
zope_flavor = zope5
python_version = 3.11

[workspace]
; Folder that contains all the repos a ticket may touch.
; The agents also use the folders open in VS Code.
root = ~/work
; Per-ticket working notes are written to <root>/<work_dir>/<KEY>/
work_dir = .sdlc
; How deep to look for git repos under root
repo_search_depth = 3

[safety]
; Actions that ALWAYS need the developer to say yes in chat first.
confirm_before = edit_repo, push, create_mr, jira_comment, jira_transition
; Agents never merge MRs, never force-push, never rewrite pushed history.

[notify]
; Also produce a short Microsoft Teams / Outlook update text. yes/no
teams_summary = yes
